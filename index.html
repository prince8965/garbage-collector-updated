<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Garbage Collector</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#f3f8fb;--card:#fff;--tx:#14263a;--mut:#64798c;--ln:#e1ebf2;--g:#0e7c5a;--e:#10b981;--r:#ef4444;--o:#f59e0b;--b:#3b82f6;--p:#8b5cf6;--t:#06b6d4;box-sizing:border-box}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding-bottom:calc(90px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:560px;margin:0 auto;padding:14px}
header{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--ln);padding:calc(10px + env(safe-area-inset-top,0px)) 14px 10px}
.hin{max-width:560px;margin:auto;display:flex;align-items:center;gap:10px}.logo{width:44px;height:44px;border-radius:14px;background:linear-gradient(135deg,#0e7c5a,#10b981);display:grid;place-items:center;font-size:22px}
.hin h2{margin:0;font-size:18px}.hin small{color:var(--mut)}.sp{flex:1}
.ib{position:relative;width:44px;height:44px;border-radius:50%;border:1px solid var(--ln);background:#fff;font-size:20px;cursor:pointer}.ib i{position:absolute;top:-2px;right:-2px;background:var(--r);color:#fff;font:700 11px system-ui;border-radius:99px;padding:2px 6px;font-style:normal}
.hero{border-radius:24px;padding:22px;color:#fff;margin-bottom:14px;box-shadow:0 10px 24px #0002}.hero small{letter-spacing:.14em;font-weight:700;opacity:.85}.hero h1{margin:6px 0;font-size:28px;line-height:1.15}.hero p{margin:0;opacity:.85}
.h-citizen{background:linear-gradient(135deg,#0e7c5a,#06b6d4)}.h-collector{background:linear-gradient(135deg,#2563eb,#8b5cf6)}.h-admin{background:linear-gradient(135deg,#0b3d2e,#0f172a)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.st{background:var(--card);border:1px solid var(--ln);border-radius:18px;padding:12px;display:flex;gap:10px;align-items:center}.st .ic{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-size:20px}.st small{color:var(--mut);font-weight:700;font-size:11px;letter-spacing:.06em;text-transform:uppercase;display:block}.st b{font-size:26px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:20px;padding:14px;margin-bottom:12px}
.roles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.role{border:2px solid var(--ln);border-radius:16px;padding:12px 2px;text-align:center;background:#fff;color:var(--tx);font:600 14px inherit;cursor:pointer}.role b{display:block;font-size:28px}
.role.on.citizen{border-color:var(--e);background:#ecfdf5}.role.on.collector{border-color:var(--b);background:#eff6ff}.role.on.admin{border-color:var(--p);background:#f5f3ff}
label{font-weight:600;font-size:14px}input,select,textarea{width:100%;padding:13px;border-radius:14px;border:1px solid var(--ln);background:#fff;color:var(--tx);font:inherit;margin:6px 0 12px}
.btn{width:100%;padding:14px;border:0;border-radius:14px;background:linear-gradient(135deg,#0e7c5a,#10b981);color:#fff;font:700 16px inherit;cursor:pointer;margin-top:4px}.btn.b{background:linear-gradient(135deg,#2563eb,#8b5cf6)}.btn.alt{background:#fff;color:var(--g);border:2px solid var(--e)}.btn.sm{width:auto;padding:9px 14px;font-size:14px;margin:0}
nav{position:fixed;left:0;right:0;bottom:0;background:#1b2236;padding:8px 6px calc(8px + env(safe-area-inset-bottom,0px));display:flex;justify-content:space-around;z-index:6}
nav button{flex:1;background:none;border:0;color:#a8b3c7;font:600 12px inherit;cursor:pointer;padding:4px 0}nav button b{display:block;font-size:22px}nav .on{color:#34d399}
.badge{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:700;color:#fff;white-space:nowrap}
.High{background:var(--r)}.Medium{background:var(--o)}.Low{background:var(--e)}.RESOLVED{background:var(--e)}.OPEN{background:#64748b}.IN_PROGRESS{background:var(--b)}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}.mut{color:var(--mut);font-size:13px}
video,img.ph{width:100%;border-radius:16px;background:#000;display:block;margin-bottom:8px}.ba{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}.ba img{margin:0}
.sev{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:6px 0 12px}.sev button{padding:12px;border-radius:14px;font:700 15px inherit;border:2px solid;cursor:pointer;opacity:.55}.sev .on{opacity:1;box-shadow:0 0 0 3px #0001}
#toast{position:fixed;left:12px;right:12px;top:calc(env(safe-area-inset-top,0px) + 10px);background:#14263a;color:#fff;padding:14px;border-radius:14px;z-index:9;display:none;max-width:536px;margin:auto;box-shadow:0 8px 24px #0006}
svg{width:100%;border-radius:16px;background:#e8f5ee;border:1px solid var(--ln)}a{color:var(--b);font-weight:700}.bar{height:10px;border-radius:9px;background:var(--e);margin:3px 0 10px}
</style></head><body><div id="toast"></div><div id="app"></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let DB={users:[],reports:[],areas:[],notes:[]},me=null,role='citizen',otp=null,tab='home',draft={sev:'Medium'},stream=null,pos=null,target=null,F={n:'',p:''};
try{Object.assign(DB,JSON.parse(localStorage.getItem('gc_db')||'{}'));me=DB.users.find(u=>u.id==localStorage.getItem('gc_me'))||null}catch(e){}
if(!DB.users.some(u=>u.role=='admin'))DB.users.push({id:'U-0001',name:'Admin',phone:'9999999999',role:'admin'});
const save=()=>{try{localStorage.setItem('gc_db',JSON.stringify(DB));localStorage.setItem('gc_me',me?me.id:'')}catch(e){toast('Storage is full – clear old reports')} fetch('/api/state',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({db:DB})}).then(async r=>{if(!r.ok){const x=await r.json().catch(()=>({}));toast(x.error||'Could not sync with database',5000)}}).catch(()=>{/* local cache remains available while offline */})};
function toast(m,t=5000){const e=$('#toast');e.textContent=m;e.style.display='block';clearTimeout(e._t);e._t=setTimeout(()=>e.style.display='none',t)}
const SC={Low:1,Medium:2,High:3},hrs=r=>(Date.now()-r.created)/36e5;
function prio(r){let s=SC[r.sev];const h=hrs(r);if(h>8)s+=2;else if(h>4)s+=1;const n=DB.reports.filter(x=>x.id!=r.id&&x.status!='RESOLVED'&&Math.abs(x.lat-r.lat)<.001&&Math.abs(x.lng-r.lng)<.001).length;return s+(n>=3?2:n?1:0)}
const pl=s=>s>=5?'High':s>=3?'Medium':'Low',km=(a,b,c,d)=>Math.hypot((c-a)*111,(d-b)*111*Math.cos(a*Math.PI/180));
const areaName=id=>(DB.areas.find(a=>a.id==id)||{}).name||'Unassigned';
function note(uid,msg){DB.notes.push({uid,msg,t:Date.now(),read:false})}
/* LOGIN */
function keep(){const n=$('#nm'),p=$('#ph');if(n)F.n=n.value;if(p)F.p=p.value}
function setRole(r){keep();role=r;otp=null;login()}
function login(){const C={citizen:['🧑','Citizen'],collector:['🚛','Collector'],admin:['🛡️','Admin']};
 $('#app').innerHTML=`<div class="wrap"><div class="hero h-${role}"><small>WELCOME</small><h1>🗑️ Garbage Collector</h1><p>Cleaner streets. Smarter operations.</p></div>
 <div class="card"><b>Who are you?</b><div class="roles">${Object.entries(C).map(([k,v])=>`<button class="role ${k} ${role==k?'on':''}" onclick="setRole('${k}')"><b>${v[0]}</b>${v[1]}</button>`).join('')}</div>
 <label>Your name</label><input id="nm" placeholder="Full name" value="${esc(F.n)}">
 <label>Mobile number</label><input id="ph" type="tel" inputmode="numeric" maxlength="10" placeholder="10-digit number" value="${esc(F.p)}">
 ${otp?`<label>Enter OTP</label><input id="ot" inputmode="numeric" maxlength="4" placeholder="4-digit OTP"><button class="btn ${role=='collector'?'b':''}" onclick="verify()">Verify & Login as ${C[role][1]}</button>`:`<button class="btn ${role=='collector'?'b':''}" onclick="sendOtp()">Send OTP</button>`}
 <p class="mut">${role=='admin'?'Admin demo number: 9999999999 (pre-registered, any name).':'First login creates your '+role+' account. One mobile number can register only one account.'}</p></div></div>`}
function sendOtp(){keep();if(F.n.trim().length<2||!/^\d{10}$/.test(F.p))return toast('Enter your name and a valid 10-digit number',3000);
 const existing=DB.users.find(x=>x.phone===F.p);if(existing&&existing.role!==role)return toast('This phone number already exists. Please select '+existing.role+' to log in.',5000);
 otp=String(Math.floor(1000+Math.random()*9000));toast('📩 Dummy OTP: '+otp,10000);login()}
function verify(){if($('#ot').value!=otp)return toast('Wrong OTP',3000);otp=null;
 const other=DB.users.find(x=>x.phone===F.p&&x.role!==role);if(other)return toast('This phone number already exists for another account.',5000);
 let u=DB.users.find(x=>x.phone==F.p&&x.role==role);
 if(role=='admin'&&!u)return toast('This number is not a registered admin',4000);
 if(!u){u={id:'U-'+String(DB.users.length+1).padStart(4,'0'),name:F.n.trim(),phone:F.p,role,area:null};DB.users.push(u)}
 else if(role!='admin')u.name=F.n.trim();
 me=u;tab='home';save();render()}
function logout(){stopCam();me=null;target=null;save();login()}
/* SHELL */
const NAV={citizen:[['home','🏠','Home'],['report','📸','Report'],['mine','🗂️','My Reports']],collector:[['home','📊','Overview'],['tasks','🧹','Tasks'],['map','🗺️','Hotspots']],admin:[['home','📊','Overview'],['reports','🗑️','Reports'],['map','🗺️','Hotspots'],['users','👥','Users'],['areas','📍','Areas']]};
function go(t){stopCam();target=null;tab=t;render()}
function vis(){return me.role=='collector'?DB.reports.filter(r=>!me.area||r.area==me.area):DB.reports}
const sorted=l=>l.slice().sort((a,b)=>(a.status=='RESOLVED')-(b.status=='RESOLVED')||prio(b)-prio(a));
function st(ic,l,v,bg){return `<div class="st"><div class="ic" style="background:${bg}">${ic}</div><div><small>${l}</small><b>${v}</b></div></div>`}
function render(){if(!me)return login();const un=DB.notes.filter(n=>n.uid==me.id&&!n.read).length;let body;
 const R=me.role=='citizen'?DB.reports.filter(r=>r.cid==me.id):vis(),cnt=s=>R.filter(r=>r.status==s).length,hi=R.filter(r=>r.status!='RESOLVED'&&pl(prio(r))=='High').length;
 const grid=(me.role=='admin'?[['🚛','Total reports',R.length,'#ecfdf5'],['🕒','Open',cnt('OPEN'),'#fffbeb'],['🚚','In progress',cnt('IN_PROGRESS'),'#eff6ff'],['🚩','High priority',hi,'#fef2f2'],['✅','Resolved',cnt('RESOLVED'),'#ecfdf5'],['👥','Users',DB.users.length,'#f5f3ff']]:
  [['🚛','Total',R.length,'#ecfdf5'],['🕒','Open',cnt('OPEN'),'#fffbeb'],['🚚','In progress',cnt('IN_PROGRESS'),'#eff6ff'],['🚩','High priority',hi,'#fef2f2'],['✅','Resolved',cnt('RESOLVED'),'#ecfdf5']]).map(x=>st(...x)).join('');
 const H={citizen:['MY CONTRIBUTION','Make your city cleaner','Report waste with a live geo-tagged photo.'],collector:['FIELD DASHBOARD',(me.area?areaName(me.area):'All areas'),'Clean high-priority spots first.'],admin:['OPERATIONS OVERVIEW','City waste at a glance','Live metrics from your citizens and field collectors.']}[me.role];
 if(tab=='home'){const top=sorted(R).filter(r=>r.status!='RESOLVED').slice(0,3);
  body=`<div class="hero h-${me.role}"><small>${H[0]}</small><h1>${esc(H[1])}</h1><p>${H[2]}</p></div><div class="grid">${grid}</div>`+
  (me.role=='citizen'?`<button class="btn" onclick="go('report')">📸 REPORT WASTE</button><h3>Recent reports</h3>`+(sorted(R).slice(0,3).map(card).join('')||'<div class="card mut">No reports yet.</div>'):
  me.role=='collector'?`<h3>🔥 High priority first</h3>`+(top.map(card).join('')||'<div class="card mut">All clear!</div>'):catBars(R))}
 else if(tab=='report')body=reportUI();
 else if(tab=='mine')body=sorted(R).map(card).join('')||'<div class="card mut">No reports yet.</div>';
 else if(tab=='tasks'||tab=='reports')body=(sorted(R).map(card).join('')||'<div class="card mut">No reports yet.</div>');
 else if(tab=='map')body=mapUI(R);
 else if(tab=='users')body=users();
 else if(tab=='areas')body=areasUI();
 else if(tab=='profile')body=profileUI();
 else if(tab=='notes'){const l=DB.notes.filter(n=>n.uid==me.id).reverse();body=`<h3>🔔 Notifications</h3>`+(l.map(n=>`<div class="card"${n.read?'':' style="border-color:#10b981"'}>${esc(n.msg)}<div class="mut">${new Date(n.t).toLocaleString()}</div></div>`).join('')||'<div class="card mut">Nothing yet.</div>');DB.notes.forEach(n=>{if(n.uid==me.id)n.read=true});save()}
 $('#app').innerHTML=`<header><div class="hin"><div class="logo">🗑️</div><div><h2>Garbage Collector</h2><small>${esc(me.name)} · ${me.role}</small></div><span class="sp"></span><button class="ib" onclick="go('notes')">🔔${un?`<i>${un}</i>`:''}</button><button class="ib" onclick="go('profile')">👤</button></div></header><div class="wrap">${body}</div>
 <nav>${NAV[me.role].map(x=>`<button class="${tab==x[0]?'on':''}" onclick="go('${x[0]}')"><b>${x[1]}</b>${x[2]}</button>`).join('')}</nav>`;
 if(tab=='report')bindReport();if(target)startCam('afterV')}
function catBars(R){const c={};R.forEach(r=>c[r.cat]=(c[r.cat]||0)+1);const m=Math.max(1,...Object.values(c)),res=R.filter(r=>r.status=='RESOLVED'),avg=res.length?(res.reduce((s,r)=>s+r.resolved-r.created,0)/res.length/36e5).toFixed(1)+' h':'–';
 return `<div class="card"><b>Reports by category</b>${Object.entries(c).map(([k,v])=>`<div class="mut" style="margin-top:8px">${esc(k)} · ${v}</div><div class="bar" style="width:${v/m*100}%"></div>`).join('')||'<p class="mut">No data yet</p>'}<p>⏱️ Average resolution time: <b>${avg}</b></p></div>`}
/* CAMERA */
function stampedShot(v,lat,lng,acc){const c=document.createElement('canvas'),w=480,h=Math.round(w*v.videoHeight/v.videoWidth);c.width=w;c.height=h+44;const x=c.getContext('2d');x.drawImage(v,0,0,w,h);x.fillStyle='#000';x.fillRect(0,h,w,44);x.fillStyle='#fff';x.font='12px sans-serif';x.fillText(`GPS ${lat.toFixed(6)}, ${lng.toFixed(6)} (±${Math.round(acc)}m)`,8,h+17);x.fillText(new Date().toLocaleString()+' · Live geo-camera',8,h+35);return c.toDataURL('image/jpeg',.6)}
const getPos=()=>new Promise((ok,no)=>navigator.geolocation?navigator.geolocation.getCurrentPosition(p=>ok(p.coords),no,{enableHighAccuracy:true,timeout:15000}):no());
async function startCam(id){stopCam();try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'},audio:false});const v=document.getElementById(id);if(v){v.srcObject=stream;v.play()}}catch(e){toast('Camera permission is required – gallery uploads are not allowed',5000)}}
function stopCam(){if(stream)stream.getTracks().forEach(t=>t.stop());stream=null}
async function snap(id){const v=document.getElementById(id);if(!v||!v.videoWidth)return toast('Camera not ready');
 try{pos=await getPos()}catch(e){return toast('Location is required for geo-camera photos',4000)}
 const img=stampedShot(v,pos.latitude,pos.longitude,pos.accuracy);stopCam();
 if(id=='afterV'){target.after=img;return finish()}Object.assign(draft,{img,lat:pos.latitude,lng:pos.longitude,acc:pos.accuracy});render()}
/* REPORT */
function reportUI(){const S={Low:['#ecfdf5','#065f46','#6ee7b7'],Medium:['#fffbeb','#92400e','#fcd34d'],High:['#fef2f2','#991b1b','#fca5a5']};
 return `<div class="card"><b>Photo evidence</b><div style="margin-top:8px">${draft.img?`<img class="ph" src="${draft.img}"><button class="btn alt" onclick="draft.img=null;render()">↻ Retake</button>`:`<video id="v" playsinline muted></video><button class="btn" onclick="snap('v')">📷 Capture geo-photo</button>`+fileBtn('before')+``}</div>
 <label>Location</label><div class="row card" style="padding:8px 12px;margin:6px 0 12px"><span id="gps">📍 ${pos?pos.latitude.toFixed(5)+', '+pos.longitude.toFixed(5):'Locating…'}</span><button class="btn alt sm" onclick="refreshPos()">↻ Refresh</button></div>
 <div id="man" style="display:none"><label>Manual location (marked unverified)</label><div class="row"><input id="mla" placeholder="Latitude" style="width:48%"><input id="mlo" placeholder="Longitude" style="width:48%"></div></div><label>Category</label><select id="cat">${['Overflowing dustbin','Roadside garbage','Illegal dumping','Plastic waste','Other'].map(c=>`<option ${draft.cat==c?'selected':''}>${c}</option>`).join('')}</select>
 <label>Severity</label><div class="sev">${Object.keys(S).map(k=>`<button id="sv${k}" class="${draft.sev==k?'on':''}" style="background:${S[k][0]};color:${S[k][1]};border-color:${S[k][2]}" onclick="setSev('${k}')">${k}</button>`).join('')}</div>
 <label>Description</label><textarea id="ds" rows="2" placeholder="Optional details"></textarea><button class="btn" onclick="submitR()">Submit report</button></div>`}
function setSev(k){draft.sev=k;['Low','Medium','High'].forEach(x=>$('#sv'+x).classList.toggle('on',x==k))}
async function refreshPos(){const g=$('#gps');if(g)g.textContent='📍 Locating…';try{pos=await getPos();if(g)g.textContent='📍 '+pos.latitude.toFixed(5)+', '+pos.longitude.toFixed(5)}catch(e){if(g)g.textContent='⚠️ Allow location access'}}
function bindReport(){if(!draft.img)startCam('v');if(!pos)refreshPos()}
function submitR(){if(!draft.img)return toast('Capture a geo-photo first',3000);let L=[draft.lat,draft.lng];if(L[0]==null){L=[parseFloat($('#mla').value),parseFloat($('#mlo').value)];if(isNaN(L[0])||isNaN(L[1])){showManual();return toast('Location needed: allow GPS or enter coordinates manually',5000)}}
 const r={id:'GC-2026-'+String(DB.reports.length+1).padStart(6,'0'),cid:me.id,cname:me.name,cat:$('#cat').value,sev:draft.sev,desc:$('#ds').value,before:draft.img,lat:L[0],lng:L[1],acc:draft.acc||null,ver:!!draft.ver,status:'OPEN',created:Date.now()};
 const a=DB.areas.map(x=>[x,km(x.lat,x.lng,r.lat,r.lng)]).filter(x=>x[1]<=x[0].km).sort((p,q)=>p[1]-q[1])[0];r.area=a?a[0].id:null;
 DB.reports.push(r);DB.users.filter(u=>u.role=='admin'||(u.role=='collector'&&(!u.area||u.area==r.area))).forEach(u=>note(u.id,`New ${r.sev} report ${r.id}: ${r.cat}`));
 draft={sev:'Medium'};save();toast('✅ Submitted: '+r.id);tab='mine';render()}
/* CARDS & WORKFLOW */
function card(r){const s=prio(r),p=pl(s),c=me.role=='collector';
 return `<div class="card"><div class="row"><b>${r.id}</b><span><span class="badge ${p}">${p} · ${s}</span> <span class="badge ${r.status}">${r.status.replace('_',' ')}</span></span></div>
 <div class="mut">${esc(r.cat)} · ${r.sev} · ${esc(r.cname)} · ${areaName(r.area)} · ${hrs(r).toFixed(1)}h ago</div><div class="mut">${r.ver?'🛰️ GPS-stamped photo':'⚠️ Location not GPS-verified'}</div>
 <div class="ba"><img class="ph" src="${r.before}">${r.after?`<img class="ph" src="${r.after}">`:''}</div>${r.desc?`<p>${esc(r.desc)}</p>`:''}
 ${me.role!='citizen'?`<div class="row" style="margin-top:10px"><a target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=${r.lat},${r.lng}">📍 View report location</a><a class="btn b sm" target="_blank" rel="noopener" href="https://www.google.com/maps/dir/?api=1&destination=${r.lat},${r.lng}&travelmode=driving">🧭 Start navigation</a></div><div class="mut">Destination: ${Number(r.lat).toFixed(6)}, ${Number(r.lng).toFixed(6)}</div>`:''}
 ${me.role=='admin'&&!r.area&&DB.areas.length?`<select onchange="assign('${r.id}',this.value)"><option value="">Assign area…</option>${DB.areas.map(a=>`<option value="${a.id}">${esc(a.name)}</option>`).join('')}</select>`:''}
 ${c&&r.status=='OPEN'?`<button class="btn b" onclick="startW('${r.id}')">▶ Start cleaning</button>`:''}
 ${c&&r.status=='IN_PROGRESS'?(target&&target.id==r.id?`<video id="afterV" playsinline muted></video><button class="btn b" onclick="snap('afterV')">📷 Capture after-cleaning photo</button>${fileBtn('after')}<button class="btn alt" onclick="go('tasks')">Cancel</button>`:`<button class="btn b" onclick="target=DB.reports.find(x=>x.id=='${r.id}');render()">✅ Upload after photo & resolve</button>`):''}
 ${r.status=='RESOLVED'?`<p class="mut">✅ Resolved in ${((r.resolved-r.created)/36e5).toFixed(1)} h</p>`:''}</div>`}
const find=id=>DB.reports.find(x=>x.id==id);
function assign(id,a){const r=find(id);r.area=a;DB.users.filter(u=>u.role=='collector'&&u.area==a).forEach(u=>note(u.id,`Report ${r.id} assigned to your area`));save();render()}
function startW(id){const r=find(id);r.status='IN_PROGRESS';r.started=Date.now();r.collector=me.id;note(r.cid,`Cleaning started for ${r.id} by ${me.name}`);save();render()}
function finish(){target.status='RESOLVED';target.resolved=Date.now();note(target.cid,`✅ Your report ${target.id} has been resolved`);save();target=null;toast('✅ Resolved – citizen notified');render()}
/* MAP, USERS, AREAS */
function mapUI(R){if(!R.length)return '<div class="card mut">No reports to plot.</div>';
 const la=R.map(r=>r.lat),ln=R.map(r=>r.lng),a=Math.min(...la),b=Math.max(...la),c=Math.min(...ln),d=Math.max(...ln),X=v=>30+(d==c?250:(v-c)/(d-c)*250),Y=v=>190-(b==a?80:(v-a)/(b-a)*160);
 const col=r=>r.status=='RESOLVED'?'#10b981':{High:'#ef4444',Medium:'#f59e0b',Low:'#3b82f6'}[pl(prio(r))];
 return `<div class="card"><b>🔥 Waste hotspots</b><svg viewBox="0 0 320 220" style="margin-top:8px">${[60,120,180,240,300].map(x=>`<line x1="${x}" y1="0" x2="${x}" y2="220" stroke="#fff" stroke-width="2"/>`).join('')}${R.map(r=>`<circle cx="${X(r.lng)}" cy="${Y(r.lat)}" r="${r.status=='RESOLVED'?6:11}" fill="${col(r)}" opacity=".8"/>`).join('')}</svg>
 <p class="mut">🔴 High &nbsp;🟠 Medium &nbsp;🔵 Low &nbsp;🟢 Resolved · visible to collectors & admin only.</p></div>`}
function users(){return DB.users.map(u=>`<div class="card row"><span><b>${esc(u.name)}</b><div class="mut">${u.id} · ${u.phone}</div></span><span>${u.role=='collector'?`<select style="width:140px;margin:0" onchange="setArea('${u.id}',this.value)"><option value="">All areas</option>${DB.areas.map(a=>`<option value="${a.id}" ${u.area==a.id?'selected':''}>${esc(a.name)}</option>`).join('')}</select>`:`<span class="badge ${u.role=='admin'?'IN_PROGRESS':'RESOLVED'}">${u.role}</span>`}</span></div>`).join('')}
function setArea(id,a){DB.users.find(u=>u.id==id).area=a||null;save();toast('Collector area updated')}
function areasUI(){return `<div class="card"><b>➕ New service area</b><input id="an" placeholder="Area name (e.g. Ward 5)"><div class="row"><input id="alt" placeholder="Latitude" style="width:48%"><input id="aln" placeholder="Longitude" style="width:48%"></div><input id="akm" type="number" placeholder="Radius in km (e.g. 2)"><button class="btn alt" onclick="myLoc()">📍 Use my location</button><button class="btn" onclick="addArea()">Add area</button></div>`+
 DB.areas.map(a=>`<div class="card row"><span><b>${esc(a.name)}</b><div class="mut">${a.lat.toFixed(4)}, ${a.lng.toFixed(4)} · ${a.km} km · ${DB.users.filter(u=>u.area==a.id).length} collector(s)</div></span><span class="badge RESOLVED">${DB.reports.filter(r=>r.area==a.id).length} reports</span></div>`).join('')}
async function myLoc(){try{const p=await getPos();$('#alt').value=p.latitude.toFixed(5);$('#aln').value=p.longitude.toFixed(5)}catch(e){toast('Allow location access')}}
function addArea(){const n=$('#an').value.trim(),la=parseFloat($('#alt').value),lo=parseFloat($('#aln').value),k=parseFloat($('#akm').value);if(!n||isNaN(la)||isNaN(lo)||!(k>0))return toast('Fill name, latitude, longitude and radius');
 DB.areas.push({id:'A-'+(DB.areas.length+1),name:n,lat:la,lng:lo,km:k});save();render()}

/* v3 overrides */
let camErr='',gpsErr='';
function stampCanvas(src,sw,sh,l1){const c=document.createElement('canvas'),w=480,h=Math.round(w*sh/sw);c.width=w;c.height=h+44;const x=c.getContext('2d');x.drawImage(src,0,0,w,h);x.fillStyle='#000';x.fillRect(0,h,w,44);x.fillStyle='#fff';x.font='12px sans-serif';x.fillText(l1,8,h+17);x.fillText(new Date().toLocaleString()+' · Geo-camera',8,h+35);return c.toDataURL('image/jpeg',.6)}
const gpsLine=p=>p?`GPS ${p.latitude.toFixed(6)}, ${p.longitude.toFixed(6)} (±${Math.round(p.accuracy)}m)`:'GPS unavailable';
const fileBtn=k=>`<label class="btn alt" style="display:block;text-align:center"><input type="file" accept="image/*" capture="environment" hidden onchange="filePhoto(this,'${k}')">📱 Open phone camera app</label>`;
function camFail(id){const v=document.getElementById(id);if(v)v.outerHTML=`<div class="card mut">📵 Live camera blocked (${esc(camErr)}). Use the phone camera button below.</div>`}
async function startCam(id){stopCam();if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){camErr='not supported here';return camFail(id)}
 try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'},audio:false});const v=document.getElementById(id);if(v){v.srcObject=stream;v.play()}}catch(e){camErr=e.name||'error';camFail(id)}}
function done(kind,img){if(kind=='after'){target.after=img;target.afterVer=!!pos;return finish()}Object.assign(draft,{img,ver:!!pos});if(pos)Object.assign(draft,{lat:pos.latitude,lng:pos.longitude,acc:pos.accuracy});render()}
async function snap(id){const v=document.getElementById(id);if(!v||!v.videoWidth)return toast('Live camera not ready – use the phone camera button');
 try{pos=await getPos()}catch(e){pos=null}
 const img=stampCanvas(v,v.videoWidth,v.videoHeight,gpsLine(pos));stopCam();done(id=='afterV'?'after':'before',img)}
async function filePhoto(inp,kind){const f=inp.files[0];if(!f)return;try{pos=await getPos()}catch(e){pos=null}
 const im=new Image();im.onload=()=>done(kind,stampCanvas(im,im.width,im.height,gpsLine(pos)));im.src=URL.createObjectURL(f)}
function showManual(){const m=$('#man');if(m)m.style.display='block'}
async function refreshPos(){const g=$('#gps');if(g)g.textContent='📍 Locating…';try{pos=await getPos();if(g)g.textContent='📍 '+pos.latitude.toFixed(5)+', '+pos.longitude.toFixed(5)}catch(e){pos=null;gpsErr=e&&e.code==1?'permission denied':e&&e.code==3?'timed out':'not available here';if(g)g.textContent='⚠️ Location '+gpsErr;showManual()}}
function profileUI(){const R=DB.reports.filter(r=>me.role=='citizen'?r.cid==me.id:r.collector==me.id);
 return `<div class="card" style="text-align:center"><div class="logo" style="margin:auto;width:72px;height:72px;font-size:36px">👤</div><h2>${esc(me.name)}</h2><span class="badge IN_PROGRESS">${me.role}</span></div>
 <div class="card"><div class="row"><span class="mut">User ID</span><b>${me.id}</b></div><div class="row"><span class="mut">Mobile</span><b>${me.phone}</b></div>${me.role=='collector'?`<div class="row"><span class="mut">Area</span><b>${me.area?esc(areaName(me.area)):'All areas'}</b></div>`:''}<div class="row"><span class="mut">Reports</span><b>${R.length}</b></div></div>
 <label>Edit name</label><input id="pn" value="${esc(me.name)}"><button class="btn alt" onclick="me.name=$('#pn').value.trim()||me.name;save();render()">Save name</button><button class="btn" style="background:#ef4444;margin-top:12px" onclick="logout()">Logout</button>`}
(async function boot(){try{const cached=JSON.parse(localStorage.getItem('gc_db')||'null');const res=await fetch('/api/state');if(res.ok){const data=await res.json();if(data.db){const serverIsFresh=data.db.reports.length===0&&data.db.users.length<=1;const cacheHasData=cached&&(cached.reports?.length||cached.users?.length>1);DB=(serverIsFresh&&cacheHasData)?cached:data.db;localStorage.setItem('gc_db',JSON.stringify(DB));me=DB.users.find(u=>u.id===localStorage.getItem('gc_me'))||null;if(serverIsFresh&&cacheHasData)save();}}}catch(e){/* use local cache if server is offline */}if(!DB.users.some(u=>u.role==='admin'))DB.users.push({id:'U-0001',name:'Admin',phone:'9999999999',role:'admin'});render()})();
</script></body></html>
